version: "3.8"

services:
  postgres:
    image: postgres:14.9
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  redis:
    image: redis
    restart: always
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 3GB
    ports:
      - "6379"

  django-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: django
    restart: always
    volumes:
      - ./media:/media
      - /mnt/meertime_data:/mnt/meertime_data
    ports:
      - "8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  cron-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: cron
    restart: always
    depends_on:
      - postgres
      - django-service
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  react-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: react
    restart: always
    volumes:
      - ./frontend:/app
    ports:
      - "3000"

  nginx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: nginx
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./media:/media
    depends_on:
      - django-service
      - react-service

  # Monitoring services
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./alloy/blackbox.yml:/config/blackbox.yml:ro
    command:
      - "--config.file=/config/blackbox.yml"
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Update the path to the Docker socket if necessary
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - "--server.http.listen-addr=0.0.0.0:12345"
    environment:
      - PROMETHEUS_PASSWORD=$CHANGEME